name: W114 Perturbation Android
on:
  push:
    branches: [main]
    paths:
      - "experiments/w114-perturbation/android/**"
      - "experiments/hodge-perturbation-game/**"
      - "experiments/test_hodge_perturbation_game.py"
      - ".github/workflows/w114-perturbation-android.yml"
  pull_request:
    paths:
      - "experiments/w114-perturbation/android/**"
      - "experiments/hodge-perturbation-game/**"
      - "experiments/test_hodge_perturbation_game.py"
      - ".github/workflows/w114-perturbation-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.10.2"}
      - name: Verify Android contract
        working-directory: experiments/w114-perturbation/android
        run: python verify_project.py
      - name: Verify W114 game contract
        run: python -m unittest experiments/test_hodge_perturbation_game.py -v
      - name: Verify JavaScript syntax
        run: |
          node --check experiments/hodge-perturbation-game/game.js
          node --check experiments/w114-perturbation/android/app/src/main/assets/game.js
      - name: Build debug APK
        working-directory: experiments/w114-perturbation/android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: W114-Perturbation-Lab-debug-apk
          path: experiments/w114-perturbation/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
